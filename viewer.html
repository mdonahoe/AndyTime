<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AndyTime Camera Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: 0.05em; }

    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #444; transition: background 0.3s; flex-shrink: 0;
    }
    .status-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
    .status-dot.connected  { background: #22c55e; }
    .status-dot.error      { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .status-text { font-size: 12px; color: #888; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      overflow: hidden;
    }

    /* ── Video panel ── */
    .video-panel {
      display: flex; flex-direction: column;
      overflow: hidden; background: #000; position: relative;
    }

    #video-tiles {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 3px;
      overflow: hidden;
      background: #0a0a0a;
    }

    .no-streams {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 14px;
    }

    /* ── Per-device tile ── */
    .video-tile {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }
    .video-tile:hover .tile-overlay { opacity: 1; }
    .video-tile video {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }

    .tile-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px 10px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      opacity: 0.85;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .tile-device {
      display: block;
      font-size: 13px; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tile-cam {
      display: block;
      font-size: 11px; color: rgba(255,255,255,0.6);
      margin-top: 2px;
    }
    .tile-hint {
      position: absolute;
      top: 8px; right: 10px;
      font-size: 10px; color: rgba(255,255,255,0.35);
      pointer-events: none;
    }
    .tile-mute-btn {
      position: absolute;
      top: 8px; left: 8px;
      width: 30px; height: 30px;
      flex: none; padding: 0;
      background: rgba(0,0,0,0.45);
      border-radius: 50%;
      font-size: 14px; line-height: 30px; text-align: center;
      color: #fff; cursor: pointer;
      opacity: 0; transition: opacity 0.2s, background 0.15s;
    }
    .video-tile:hover .tile-mute-btn { opacity: 1; }
    .tile-mute-btn.muted { background: rgba(239,68,68,0.75); opacity: 1; }

    /* ── Local camera PiP ── */
    #local-pip {
      position: absolute;
      bottom: 16px; right: 16px;
      width: 160px; height: 120px;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #333;
      display: none;
      z-index: 10;
    }
    #local-pip video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #pip-label {
      position: absolute;
      bottom: 4px; left: 6px;
      font-size: 10px; color: rgba(255,255,255,0.6);
      pointer-events: none;
    }

    /* ── Sidebar ── */
    .sidebar {
      display: flex; flex-direction: column;
      border-left: 1px solid #1e1e1e; overflow: hidden;
    }

    .config-section { padding: 14px; border-bottom: 1px solid #1e1e1e; flex-shrink: 0; }
    .config-section h2 {
      font-size: 11px; font-weight: 600; color: #666;
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;
    }
    .field { margin-bottom: 8px; }
    .field label { display: block; font-size: 11px; color: #888; margin-bottom: 3px; }
    .field input {
      width: 100%; background: #111; border: 1px solid #2a2a2a; border-radius: 6px;
      color: #e0e0e0; font-size: 12px; padding: 6px 8px; outline: none;
      font-family: "SF Mono", Menlo, monospace;
    }
    .field input:focus { border-color: #3b82f6; }

    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1; padding: 8px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    button:disabled { opacity: .4; cursor: default; }
    button:not(:disabled):hover { opacity: .85; }
    #btn-connect    { background: #3b82f6; color: #fff; }
    #btn-disconnect { background: #ef4444; color: #fff; display: none; }
    #btn-camera     { background: #6366f1; color: #fff; display: none; }
    #btn-camera.active { background: #ef4444; }
    #btn-mic        { background: #059669; color: #fff; display: none; }
    #btn-mic.muted  { background: #f59e0b; }

    .stats-section { padding: 12px 14px 10px; border-bottom: 1px solid #1e1e1e; flex-shrink: 0; }
    .stats-section h2 {
      font-size: 11px; font-weight: 600; color: #666;
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
    }
    #stats-grid {
      display: grid; grid-template-columns: auto 1fr; gap: 3px 10px;
      font-size: 12px; font-family: "SF Mono", Menlo, monospace;
    }
    .stat-key { color: #666; }
    .stat-value { color: #e0e0e0; }
    .stat-value.connected { color: #22c55e; }
    .stat-value.error { color: #ef4444; }

    .log-section { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; border-bottom: 1px solid #1e1e1e; flex-shrink: 0;
    }
    .log-header h2 {
      font-size: 11px; font-weight: 600; color: #666;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    #btn-clear-log {
      flex: none; padding: 3px 10px; font-size: 11px; font-weight: 500;
      background: #1e1e1e; color: #888; border-radius: 4px;
    }
    #log {
      flex: 1; overflow-y: auto; padding: 8px 14px;
      font-family: "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.6; color: #888;
    }
    .log-entry { display: flex; gap: 8px; }
    .log-time  { color: #444; flex-shrink: 0; }
    .log-msg.info    { color: #60a5fa; }
    .log-msg.success { color: #4ade80; }
    .log-msg.warn    { color: #fbbf24; }
    .log-msg.error   { color: #f87171; }
    .log-msg.track   { color: #a78bfa; }
    .log-msg.data    { color: #94a3b8; }
  </style>
</head>
<body>

<header>
  <h1>ANDYTIME CAMERA VIEWER</h1>
  <div class="status-dot" id="status-dot"></div>
  <span class="status-text" id="status-text">Disconnected</span>
</header>

<main>
  <div class="video-panel">
    <div id="video-tiles">
      <div class="no-streams" id="no-streams-msg">No streams — connect in the sidebar</div>
    </div>
    <!-- HTML viewer's own camera PiP -->
    <div id="local-pip">
      <video id="local-video" autoplay playsinline muted></video>
      <span id="pip-label">You</span>
    </div>
  </div>

  <div class="sidebar">
    <div class="config-section">
      <h2>Connection</h2>
      <div class="field">
        <label>Room name</label>
        <input type="text" id="room" value="andytime" spellcheck="false" />
      </div>
      <div class="btn-row">
        <button id="btn-connect">Connect</button>
        <button id="btn-disconnect">Disconnect</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button id="btn-camera">Enable Camera</button>
        <button id="btn-mic">Mute Mic</button>
      </div>
    </div>

    <div class="stats-section">
      <h2>Stats</h2>
      <div id="stats-grid">
        <span class="stat-key">state</span>       <span class="stat-value" id="s-state">—</span>
        <span class="stat-key">room</span>        <span class="stat-value" id="s-room">—</span>
        <span class="stat-key">participants</span> <span class="stat-value" id="s-parts">—</span>
        <span class="stat-key">tracks</span>      <span class="stat-value" id="s-tracks">—</span>
        <span class="stat-key">latency</span>     <span class="stat-value" id="s-latency">—</span>
      </div>
    </div>

    <div class="log-section">
      <div class="log-header">
        <h2>Debug Log</h2>
        <button id="btn-clear-log">Clear</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
</main>

<!-- LiveKit JS client -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<script>
(function () {
  'use strict';

  // ── Hardcoded credentials ──────────────────────────────────────────────────
  const LK_URL    = 'wss://andytime-n3a13lj5.livekit.cloud';
  const LK_KEY    = 'APITxc5HK2bwMX5';
  const LK_SECRET = 'HplIUtx8sSCz2jo0rQulzY4GDoIx5QfcfjSunoNZlJk';
  // ──────────────────────────────────────────────────────────────────────────

  const LC = window.LivekitClient;
  const { Room, RoomEvent, Track, ConnectionState } = LC;

  let room = null;
  let statsInterval = null;
  let localCameraTrack = null;
  let micEnabled = false;

  // identity → { cameras: string[], index: number }
  const participantState = {};

  // ── JWT via Web Crypto ──
  async function makeToken(roomName) {
    const enc = new TextEncoder();
    function b64url(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    }
    const now = Math.floor(Date.now() / 1000);
    const header  = b64url(enc.encode(JSON.stringify({ alg: 'HS256', typ: 'JWT' })));
    const payload = b64url(enc.encode(JSON.stringify({
      iss: LK_KEY, sub: 'html-viewer', iat: now, exp: now + 21600,
      video: { roomJoin: true, room: roomName, canPublish: true, canSubscribe: true, canPublishData: true },
    })));
    const message = `${header}.${payload}`;
    const key = await crypto.subtle.importKey(
      'raw', enc.encode(LK_SECRET), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
    );
    const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
    return `${message}.${b64url(sig)}`;
  }

  // ── Logging ──
  function log(msg, type = 'data') {
    const el = document.getElementById('log');
    const now = new Date();
    const ts = now.toTimeString().slice(0,8) + '.' + String(now.getMilliseconds()).padStart(3,'0');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="log-time">${ts}</span><span class="log-msg ${type}">${esc(msg)}</span>`;
    el.appendChild(entry);
    el.scrollTop = el.scrollHeight;
  }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function setStatus(cls, text) {
    document.getElementById('status-dot').className = 'status-dot ' + cls;
    document.getElementById('status-text').textContent = text;
  }

  // ── Stats ──
  function updateStats() {
    if (!room) return;
    const state = room.state;
    const el = document.getElementById('s-state');
    el.textContent = state;
    el.className = 'stat-value ' + (state === ConnectionState.Connected ? 'connected' : state === ConnectionState.Disconnected ? 'error' : '');
    document.getElementById('s-room').textContent = room.name || '—';
    document.getElementById('s-parts').textContent = room.numParticipants;
    let tracks = 0;
    room.remoteParticipants.forEach(p => p.trackPublications.forEach(pub => { if (pub.isSubscribed) tracks++; }));
    document.getElementById('s-tracks').textContent = tracks;
    const lat = room.engine?.latency;
    document.getElementById('s-latency').textContent = lat != null ? lat + ' ms' : '—';
  }

  // ── Video tiles ──
  function getOrCreateTile(identity) {
    const id = 'tile-' + identity.replace(/[^a-zA-Z0-9]/g, '_');
    let tile = document.getElementById(id);
    if (!tile) {
      document.getElementById('no-streams-msg').style.display = 'none';
      tile = document.createElement('div');
      tile.className = 'video-tile';
      tile.id = id;
      tile.dataset.identity = identity;
      tile.innerHTML = `
        <video autoplay playsinline></video>
        <button class="tile-mute-btn" title="Mute">🔊</button>
        <div class="tile-overlay">
          <span class="tile-device">${esc(identity)}</span>
          <span class="tile-cam">—</span>
        </div>
        <span class="tile-hint">click to switch camera</span>
      `;
      tile.addEventListener('click', () => onTileClick(identity));
      tile.querySelector('.tile-mute-btn').addEventListener('click', e => {
        e.stopPropagation();
        const muted = !(participantState[identity]?.muted ?? false);
        requestMuteChange(identity, muted);
      });
      document.getElementById('video-tiles').appendChild(tile);
    }
    return tile;
  }

  function removeTile(identity) {
    const id = 'tile-' + identity.replace(/[^a-zA-Z0-9]/g, '_');
    document.getElementById(id)?.remove();
    delete participantState[identity];
    if (document.querySelectorAll('.video-tile').length === 0) {
      document.getElementById('no-streams-msg').style.display = '';
    }
  }

  function removeAllTiles() {
    document.querySelectorAll('.video-tile').forEach(t => t.remove());
    Object.keys(participantState).forEach(k => delete participantState[k]);
    document.getElementById('no-streams-msg').style.display = '';
  }

  function updateTileCamLabel(identity) {
    const id = 'tile-' + identity.replace(/[^a-zA-Z0-9]/g, '_');
    const tile = document.getElementById(id);
    if (!tile) return;
    const state = participantState[identity];
    tile.querySelector('.tile-cam').textContent = state?.cameras[state.index] ?? '—';
    // Only show hint if there are multiple cameras to cycle
    const hint = tile.querySelector('.tile-hint');
    if (hint) hint.style.display = state?.cameras.length > 1 ? '' : 'none';
  }

  function onTileClick(identity) {
    const state = participantState[identity];
    if (!state || state.cameras.length <= 1) return;
    const nextIndex = (state.index + 1) % state.cameras.length;
    requestCameraSwitch(identity, nextIndex);
  }

  async function requestCameraSwitch(identity, index) {
    if (!room) return;
    const data = new TextEncoder().encode(JSON.stringify({ type: 'switchCamera', index }));
    try {
      await room.localParticipant.publishData(data, {
        topic: 'camera-control', reliable: true, destinationIdentities: [identity],
      });
      log(`📷 → ${identity}: switch to camera ${index}`, 'info');
    } catch (e) {
      log(`✗ Camera switch error: ${e.message}`, 'error');
    }
  }

  function updateTileMuteBtn(identity) {
    const id = 'tile-' + identity.replace(/[^a-zA-Z0-9]/g, '_');
    const btn = document.getElementById(id)?.querySelector('.tile-mute-btn');
    if (!btn) return;
    const muted = participantState[identity]?.muted ?? false;
    btn.textContent = muted ? '🔇' : '🔊';
    btn.title = muted ? 'Unmute' : 'Mute';
    btn.classList.toggle('muted', muted);
  }

  async function requestMuteChange(identity, muted) {
    if (!room) return;
    const data = new TextEncoder().encode(JSON.stringify({ type: 'setMute', muted }));
    try {
      await room.localParticipant.publishData(data, {
        topic: 'camera-control', reliable: true, destinationIdentities: [identity],
      });
      log(`${muted ? '🔇' : '🔊'} → ${identity}: ${muted ? 'mute' : 'unmute'}`, 'info');
    } catch (e) {
      log(`✗ Mute error: ${e.message}`, 'error');
    }
  }

  // ── Local camera (HTML viewer) ──
  async function enableCamera() {
    if (localCameraTrack) return;
    if (!window.isSecureContext) {
      log('✗ Camera requires a secure context (http://localhost:…)', 'error');
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      log('✗ getUserMedia not available in this browser.', 'error');
      return;
    }
    log('📷 Requesting camera + mic permission…', 'info');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 }, audio: true });
      stream.getTracks().forEach(t => t.stop());
      await room.localParticipant.setCameraEnabled(true);
      await room.localParticipant.setMicrophoneEnabled(true);
      micEnabled = true;
      document.getElementById('btn-mic').style.display = 'block';
      document.getElementById('btn-mic').textContent = 'Mute Mic';
      document.getElementById('btn-mic').classList.remove('muted');
      log('🎤 Microphone published', 'success');
      const pub = room.localParticipant.getTrackPublication(Track.Source.Camera);
      if (pub?.track) {
        localCameraTrack = pub.track;
        localCameraTrack.attach(document.getElementById('local-video'));
        document.getElementById('local-pip').style.display = 'block';
      }
      log('✓ Local camera published', 'success');
      document.getElementById('btn-camera').textContent = 'Disable Camera';
      document.getElementById('btn-camera').classList.add('active');
    } catch (err) {
      log(`✗ Camera error: ${err.message}`, 'error');
      localCameraTrack = null;
    }
  }

  async function disableCamera() {
    if (!localCameraTrack) return;
    await room.localParticipant.setCameraEnabled(false);
    await room.localParticipant.setMicrophoneEnabled(false);
    localCameraTrack.detach();
    localCameraTrack = null;
    micEnabled = false;
    document.getElementById('local-pip').style.display = 'none';
    document.getElementById('local-video').srcObject = null;
    document.getElementById('btn-camera').textContent = 'Enable Camera';
    document.getElementById('btn-camera').classList.remove('active');
    document.getElementById('btn-mic').style.display = 'none';
    log('📷 Local camera + mic stopped', 'warn');
  }

  async function toggleMic() {
    if (!micEnabled) return;
    const isMuted = room.localParticipant.isMicrophoneEnabled === false;
    await room.localParticipant.setMicrophoneEnabled(isMuted);
    const nowMuted = !isMuted;
    document.getElementById('btn-mic').textContent = nowMuted ? 'Unmute Mic' : 'Mute Mic';
    document.getElementById('btn-mic').classList.toggle('muted', nowMuted);
    log(nowMuted ? '🔇 Mic muted' : '🎤 Mic unmuted', 'info');
  }

  async function toggleCamera() {
    if (localCameraTrack) await disableCamera();
    else await enableCamera();
  }

  // ── Room ──
  function createRoom() {
    room = new Room({ adaptiveStream: true, dynacast: true });

    room
      .on(RoomEvent.Connected, () => {
        log(`✓ Connected — room: ${room.name}`, 'success');
        setStatus('connected', `Connected · ${room.name}`);
        document.getElementById('btn-connect').style.display    = 'none';
        document.getElementById('btn-disconnect').style.display = 'block';
        document.getElementById('btn-camera').style.display     = 'block';
        document.getElementById('btn-connect').disabled = false;
        statsInterval = setInterval(updateStats, 1000);
        updateStats();
      })
      .on(RoomEvent.Disconnected, (reason) => {
        log(`✗ Disconnected${reason ? ' (' + reason + ')' : ''}`, 'error');
        setStatus('', 'Disconnected');
        document.getElementById('btn-connect').style.display    = '';
        document.getElementById('btn-disconnect').style.display = 'none';
        document.getElementById('btn-camera').style.display     = 'none';
        document.getElementById('btn-mic').style.display        = 'none';
        if (localCameraTrack) {
          localCameraTrack.detach();
          localCameraTrack = null;
          micEnabled = false;
          document.getElementById('local-pip').style.display = 'none';
          document.getElementById('btn-camera').textContent = 'Enable Camera';
          document.getElementById('btn-camera').classList.remove('active');
          document.getElementById('btn-mic').textContent = 'Mute Mic';
          document.getElementById('btn-mic').classList.remove('muted');
        }
        removeAllTiles();
        clearInterval(statsInterval);
        updateStats();
      })
      .on(RoomEvent.Reconnecting,  () => { log('⟳ Reconnecting…', 'warn');  setStatus('connecting', 'Reconnecting…'); })
      .on(RoomEvent.Reconnected,   () => { log('✓ Reconnected', 'success'); setStatus('connected', `Connected · ${room.name}`); })
      .on(RoomEvent.ParticipantConnected,    p => { log(`👤 Joined: ${p.identity}`, 'info');  updateStats(); })
      .on(RoomEvent.ParticipantDisconnected, p => {
        log(`👤 Left: ${p.identity}`, 'warn');
        removeTile(p.identity);
        updateStats();
      })
      .on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
        log(`📡 Subscribed: ${track.kind} from ${participant.identity}`, 'track');
        if (track.kind === Track.Kind.Video) {
          const tile = getOrCreateTile(participant.identity);
          track.attach(tile.querySelector('video'));
          if (!participantState[participant.identity]) {
            participantState[participant.identity] = { cameras: [], index: 0 };
          }
          updateTileCamLabel(participant.identity);
        } else if (track.kind === Track.Kind.Audio) {
          document.body.appendChild(track.attach());
          log('🔊 Audio attached', 'track');
        }
        updateStats();
      })
      .on(RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
        log(`📡 Unsubscribed: ${track.kind} from ${participant.identity}`, 'warn');
        track.detach();
        // Don't remove the tile here — iOS republishes the track during camera switches,
        // causing a brief unsubscribe/subscribe cycle. Only remove on ParticipantDisconnected.
        updateStats();
      })
      .on(RoomEvent.TrackMuted,   (pub, p) => log(`🔇 Muted: ${pub.kind} (${p.identity})`, 'warn'))
      .on(RoomEvent.TrackUnmuted, (pub, p) => log(`🔊 Unmuted: ${pub.kind} (${p.identity})`, 'info'))
      .on(RoomEvent.ConnectionQualityChanged, (q, p) => log(`📶 Quality: ${q} (${p.identity})`, 'data'))
      .on(RoomEvent.SignalConnected, () => log('🔗 Signal connected', 'info'))
      .on(RoomEvent.MediaDevicesError, err => log(`⚠️ Media error: ${err.message}`, 'error'))
      .on(RoomEvent.DataReceived, (payload, participant, kind, topic) => {
        if (topic !== 'camera-control' || !participant) return;
        const identity = participant.identity;
        try {
          const msg = JSON.parse(new TextDecoder().decode(payload));
          if (!participantState[identity]) participantState[identity] = { cameras: [], index: 0, muted: false };
          if (msg.type === 'cameraList') {
            participantState[identity].cameras = msg.cameras || [];
            participantState[identity].index   = msg.current ?? 0;
            updateTileCamLabel(identity);
            log(`📷 ${identity}: [${msg.cameras.join(', ')}]`, 'info');
          } else if (msg.type === 'muteState') {
            participantState[identity].muted = msg.muted ?? false;
            updateTileMuteBtn(identity);
            log(`${msg.muted ? '🔇' : '🔊'} ${identity}: ${msg.muted ? 'muted' : 'unmuted'}`, 'info');
          }
        } catch (e) { /* ignore malformed */ }
      });
  }

  // ── Connect / disconnect ──
  async function connect() {
    const roomName = document.getElementById('room').value.trim() || 'andytime';
    document.getElementById('btn-connect').disabled = true;
    setStatus('connecting', 'Connecting…');
    log(`⟳ Generating token for room "${roomName}"…`, 'info');
    let token;
    try {
      token = await makeToken(roomName);
    } catch (err) {
      log(`✗ Token generation failed: ${err.message}`, 'error');
      setStatus('error', 'Error');
      document.getElementById('btn-connect').disabled = false;
      return;
    }
    log(`⟳ Connecting to ${LK_URL}…`, 'info');
    createRoom();
    try {
      await room.connect(LK_URL, token);
    } catch (err) {
      log(`✗ Connect failed: ${err.message}`, 'error');
      setStatus('error', 'Error');
      document.getElementById('btn-connect').disabled = false;
      room = null;
    }
  }

  async function disconnect() {
    if (!room) return;
    log('⟳ Disconnecting…', 'info');
    await room.disconnect();
    room = null;
  }

  // ── Event wiring ──
  document.getElementById('btn-connect').addEventListener('click', connect);
  document.getElementById('btn-disconnect').addEventListener('click', disconnect);
  document.getElementById('btn-camera').addEventListener('click', toggleCamera);
  document.getElementById('btn-mic').addEventListener('click', toggleMic);
  document.getElementById('btn-clear-log').addEventListener('click', () => { document.getElementById('log').innerHTML = ''; });
  document.getElementById('room').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

  log('LiveKit viewer ready  ·  server: ' + LK_URL, 'info');
  log('Enter a room name and click Connect.', 'data');
})();
</script>
</body>
</html>
